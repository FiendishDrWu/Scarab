[package]
name = "scarab"
version = "1.9.8"
edition = "2024"
build = "build.rs"
description = "Asset catalog generator for MechWarrior 5: Mercenaries"
license = "MIT"
repository = "https://github.com/FiendishDrWu/Scarab"
readme = "README.md"
publish = false

[dependencies]
byteorder = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
repak = { git = "https://github.com/trumank/repak.git", rev = "355b5f62f51959c7cc6dd5a51708646ef483065d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unreal_asset = "0.1.16"

[build-dependencies]
winresource = "0.1.31"

[package.metadata.winresource]
CompanyName = "Kung Fu Island"
ProductName = "Scarab"
FileDescription = "MW5 Mercenaries Asset Catalog Generator"
InternalName = "scarab"
OriginalFilename = "scarab.exe"
LegalCopyright = "Copyright © 2026 FiendishDrWu"
